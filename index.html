<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生长树：图论</title>
    <!-- 引入第三方 delaunay 库 -->
    <script src="https://cdn.jsdelivr.net/npm/d3-delaunay@6"></script>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div id="app">
        <div id="ui-header">
            <h1>🌳 生长树：图论</h1>
            <div id="turnIndicator">当前回合：红方</div>
            <div>
                <!-- 新增：保存与读档按钮 -->
                <button id="saveBtn" style="margin-right: 8px;">💾 保存</button>
                <button id="loadBtn" style="margin-right: 8px;">📂 读档</button>
                <button id="endTurn">⏭️ 跳过回合</button>
            </div>
        </div>
        <div id="canvas-container">
            <canvas id="gameCanvas" width="1800" height="1200"></canvas>
        </div>
    </div>
    
    <script type="module" src="./js/main.js"></script>
</body>
</html>
