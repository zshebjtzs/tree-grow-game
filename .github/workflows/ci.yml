name: CI
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - name: Collect AI decision-time baseline
        run: npm run benchmark:ai
      - run: npm run build
        env:
          GITHUB_ACTIONS: true
      - name: Verify GitHub Pages build output
        run: npm run verify:pages
