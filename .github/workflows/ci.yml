name: CI
on:
  push:
    branches: ["**"]
    paths-ignore: ["docs/**"]
  pull_request:
    paths-ignore: ["docs/**"]
  workflow_dispatch:
    inputs:
      tournament_seed_count:
        description: "Number of map seeds for the full AI tournament"
        required: false
        default: "5"
        type: string
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - name: Collect replay save performance baseline
        run: npm run benchmark:replay
      - name: Collect AI decision-time baseline
        run: npm run benchmark:ai
      - name: Run full paired AI tournament
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          TOURNAMENT_SEED_COUNT: ${{ inputs.tournament_seed_count || '5' }}
        run: node scripts/tournament-ai.js --seed-count "$TOURNAMENT_SEED_COUNT" --pair-games 2 --max-plies 80 > ai-tournament-results.json
      - name: Upload AI tournament results
        if: always() && github.event_name == 'workflow_dispatch' && hashFiles('ai-tournament-results.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ai-tournament-results
          path: ai-tournament-results.json
      - run: npm run build
        env:
          GITHUB_ACTIONS: true
      - name: Verify GitHub Pages build output
        run: npm run verify:pages
