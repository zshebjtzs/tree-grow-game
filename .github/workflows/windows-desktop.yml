name: Windows Desktop Build

on:
  push:
    branches:
      - feat/windows-offline-desktop
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-desktop:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm install

      - name: Run frontend tests
        run: npm test

      - name: Build frontend for local virtual HTTPS origin
        shell: pwsh
        run: |
          $env:VITE_BASE_PATH = "/"
          npm run build

      - name: Verify desktop frontend bundle
        shell: pwsh
        run: |
          $html = Get-Content dist/index.html -Raw
          if ($html -match '/tree-grow-game/') {
            throw "Desktop bundle contains a GitHub Pages base path."
          }
          $refs = [regex]::Matches($html, '(?:src|href)="([^"]+)"') | ForEach-Object { $_.Groups[1].Value }
          foreach ($ref in $refs) {
            if ($ref.StartsWith('/')) {
              $asset = Join-Path "dist" $ref.TrimStart('/')
            } else {
              $asset = Join-Path "dist" $ref
            }
            if (-not (Test-Path $asset)) {
              throw "Missing frontend asset: $asset"
            }
          }
          $worker = Get-ChildItem dist/assets -Filter "AIWorker-*.js"
          if (-not $worker) {
            throw "Bundled AI Worker was not found."
          }
          $mainBundles = Get-ChildItem dist/assets -Filter "*.js" | Where-Object { $_.Name -ne $worker.Name }
          $workerReference = $mainBundles | Where-Object {
            (Get-Content $_.FullName -Raw).Contains($worker.Name)
          }
          if (-not $workerReference) {
            throw "No application bundle references the generated AI Worker asset."
          }
          $moduleWorkerReference = $workerReference | Where-Object {
            (Get-Content $_.FullName -Raw) -match 'type:"module"'
          }
          if (-not $moduleWorkerReference) {
            throw "The application bundle does not configure the AI Worker as a module worker."
          }
          Write-Host "Frontend entry assets, AI Worker asset reference, and module-worker configuration verified."
          
      - name: Install WebView2 SDK
        shell: pwsh
        run: nuget install Microsoft.Web.WebView2 -Version 1.0.2903.40 -NonInteractive -OutputDirectory packages

      - name: Configure native host
        shell: pwsh
        run: |
          $sdk = Join-Path $env:GITHUB_WORKSPACE "packages/Microsoft.Web.WebView2.1.0.2903.40/build/native"
          cmake -S desktop -B build/desktop -A x64 "-DWEBVIEW2_SDK_DIR=$sdk"

      - name: Compile native host
        run: cmake --build build/desktop --config Release

      - name: Assemble portable folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release/TreeGrow/www | Out-Null
          Copy-Item dist/* release/TreeGrow/www/ -Recurse -Force
          Copy-Item build/desktop/out/TreeGrow.exe release/TreeGrow/TreeGrow.exe -Force
          Compress-Archive -Path release/TreeGrow -DestinationPath release/TreeGrow-Windows-x64.zip -Force

      - name: Run WebView2 page and module Worker smoke test
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "release/TreeGrow/TreeGrow.exe"
          $process = Start-Process -FilePath $exe -ArgumentList "--smoke-test" -PassThru -WindowStyle Hidden
          if (-not $process.WaitForExit(60000)) {
            Stop-Process -Id $process.Id -Force
            throw "WebView2 runtime smoke test timed out after 60 seconds."
          }
          if ($process.ExitCode -ne 0) {
            throw "WebView2 page/AI Worker smoke test failed with exit code $($process.ExitCode)."
          }
          Write-Host "WebView2 loaded the game page and executed the bundled module AI Worker."

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TreeGrow-Windows-x64
          path: release/TreeGrow-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
