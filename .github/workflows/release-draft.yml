name: Draft Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing version tag to prepare (for example, v1.6.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the requested release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name }}
          fetch-depth: 0

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+[.][0-9]+[.][0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "A GitHub Release already exists for $RELEASE_TAG." >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run automated tests
        run: npm test

      - name: Build production frontend
        run: npm run build

      - name: Assemble browser offline package
        shell: bash
        run: |
          mkdir -p release/tree-grow-game
          cp -R dist release/tree-grow-game/
          cp scripts/Start-Game.ps1 release/tree-grow-game/
          cp README-OFFLINE.txt release/tree-grow-game/
          cp LICENSE LICENSE-DOCUMENTATION THIRD_PARTY_NOTICES.md GAME-RULES.md README.md release/tree-grow-game/
          cd release
          zip -r ../tree-grow-game-windows-offline.zip tree-grow-game

      - name: Create draft release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag_name }}
        run: |
          gh release create "$RELEASE_TAG" tree-grow-game-windows-offline.zip --title "TreeGrow $RELEASE_TAG" --generate-notes --draft --verify-tag

      - name: Print manual release checklist
        env:
          RELEASE_TAG: ${{ inputs.tag_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          {
            echo "## Draft release created"
            echo
            echo "Draft: https://github.com/$REPOSITORY/releases/tag/$RELEASE_TAG"
            echo
            echo "Before publishing:"
            echo "1. Review and edit the GitHub-generated release notes."
            echo "2. Upload the matching TreeGrow-Windows-x64.zip from a successful Windows Desktop Build."
            echo "3. Verify the version, assets, download instructions, and notes."
            echo "4. Publish the release manually when ready."
          } >> "$GITHUB_STEP_SUMMARY"
