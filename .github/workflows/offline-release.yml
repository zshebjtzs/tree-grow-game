name: Offline Release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Assemble Windows offline package
        shell: bash
        run: |
          mkdir -p release/tree-grow-game
          cp -R dist release/tree-grow-game/
          cp scripts/Start-Game.ps1 release/tree-grow-game/
          cp README-OFFLINE.txt release/tree-grow-game/
          cd release
          zip -r ../tree-grow-game-windows-offline.zip tree-grow-game
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" tree-grow-game-windows-offline.zip \
            --title "Tree Grow Game ${GITHUB_REF_NAME}" \
            --notes "Windows offline package. Extract the archive and run Start-Game.ps1. No Node.js or network connection is required at runtime."
